<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">AlienGamer Mode</title>
  <desc id="desc">Emblema circular naranja y negro: medio rostro alienígena y medio medidor de rendimiento.</desc>
  <defs>
    <clipPath id="left-half"><rect width="512" height="1024" /></clipPath>
    <clipPath id="right-half"><rect x="512" width="512" height="1024" /></clipPath>
  </defs>

  <!-- Dos mitades complementarias sobre fondo transparente. -->
  <circle cx="512" cy="512" r="420" fill="#000000" stroke="#FF7A00" stroke-width="58" clip-path="url(#left-half)" />
  <circle cx="512" cy="512" r="420" fill="#FF7A00" stroke="#000000" stroke-width="58" clip-path="url(#right-half)" />

  <!-- Medio rostro alienígena, sin orejas. -->
  <path fill="#FF7A00" d="M176 400 C260 385 365 430 430 525 C456 563 469 608 464 644 C378 649 292 616 238 553 C197 505 177 452 176 400 Z" />
  <path fill="#000000" d="M218 449 C270 500 333 551 410 606 C330 584 260 534 218 449 Z" />

  <!-- División central y medidor. -->
  <path fill="#FF7A00" d="M500 92 H524 V476 H500 Z M500 548 H524 V932 H500 Z" />
  <path fill="none" stroke="#000000" stroke-width="48" stroke-linecap="butt" d="M604 238 A300 300 0 0 1 786 764" />
  <path fill="none" stroke="#000000" stroke-width="30" d="M643 274 L615 348 M737 327 L682 387 M794 420 L718 445 M811 529 L731 526 M781 638 L708 604 M716 723 L658 664" />
  <path fill="#000000" d="M528 526 L748 365 Q770 350 783 368 Q796 387 775 402 L554 552 Z" />
  <circle cx="512" cy="512" r="57" fill="#FF7A00" />
  <circle cx="512" cy="512" r="25" fill="#000000" />
</svg>
