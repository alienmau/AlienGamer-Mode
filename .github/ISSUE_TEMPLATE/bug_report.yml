name: Reportar un problema
description: Informa un fallo reproducible de AlienGamer Mode
title: "[Error]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Gracias por ayudar a mejorar AlienGamer Mode. No publiques información privada.
  - type: input
    id: version
    attributes:
      label: Versión de AlienGamer Mode
      placeholder: 1.0.9
    validations:
      required: true
  - type: textarea
    id: hardware
    attributes:
      label: Equipo y pantalla
      description: CPU, GPU, almacenamiento, resolución, escala DPI y cantidad de monitores.
    validations:
      required: true
  - type: input
    id: dependencies
    attributes:
      label: Versiones de Rainmeter y HWiNFO
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: ¿Qué ocurrió?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducirlo
      placeholder: "1. Abrí...\n2. Pulsé...\n3. Apareció..."
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Capturas o registros
      description: Revisa y elimina datos personales antes de adjuntarlos.
