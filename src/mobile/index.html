 }catch(e){if(epoch===wakeEpoch){$('awake').checked=false;wakeMessage('El navegador no lo permitió. Revisa el ahorro de batería o intenta de nuevo.')}}
}

const definitions=[['clock','clock','Reloj',2],['fps','fps','FPS y tiempo de cuadro',2],['alerts','alerts','Alertas',2],['ram','ram','RAM',1],['vram','vram','VRAM',1],['gpu','system','Uso GPU',1],['cpu','system','Uso CPU',1],['temperatures','temperatures','Temperaturas',2],['timer','timer','Temporizador',2],['processors','processors','Procesadores',2]].map(([id,module,name,columns])=>({id,module,name,columns,size:'normal'}));

}
function saveLayout(){try{localStorage.setItem(storageKey(),JSON.stringify(layout));$('storageWarning').hidden=true}catch(e){$('storageWarning').hidden=false}}

}
for(const d of definitions){const card=document.createElement('article');card.className='card'+(['ram','vram','cpu','gpu'].includes(d.id)?' sensor-card':'')+(d.id==='clock'?' clock-card':'')+(['fps','frameTime'].includes(d.id)?' metric-card':'');card.dataset.id=d.id;card.dataset.module=d.module;card.setAttribute('aria-label',d.name);card.innerHTML=`<div class="edit-tools"><button class="drag-handle" aria-label="Mover ${d.name}">Mover</button><button class="hide-card" aria-label="Ocultar ${d.name}">Ocultar</button></div>`+content(d);card.querySelector('.hide-card').addEventListener('click',()=>{layout.hidden.push(d.id);commit()});card.querySelector('.drag-handle').addEventListener('pointerdown',e=>startDrag(e,d.id));cards.set(d.id,card)}
function arrange(){for(const id of layout.order){const d=definitions.find(x=>x.id===id),card=cards.get(id);card.dataset.size=layout.sizes[id];card.hidden=!allowed(d)||layout.hidden.includes(id);$('grid').append(card)}if(editing)renderSettings();$('flyColor').value=layout.flyColor;packCards();drawClock()}
// Shortest contiguous lane group; a full-width card is a barrier for later cards.
// DOM/tab order remains the saved order, rather than column-first ordering.
function packCards(){
 const grid=$('grid'),width=grid.clientWidth;if(!width)return;
 const columns=Number(getComputedStyle(grid).getPropertyValue('--columns')),gap=10,unit=(width+gap)/columns,heights=Array(columns).fill(0);

 for(const id of layout.order){const card=cards.get(id);if(card.hidden)continue;const d=definitions.find(x=>x.id===id),span=layout.sizes[id]==='extended'?columns:Math.min(columns,layout.sizes[id]==='minimum'?1:d.columns);card.style.width=(unit*span-gap)+'px';let lane=0,top=Infinity;for(let i=0;i<=columns-span;i++){const y=Math.max(...heights.slice(i,i+span));if(y<top-.5){top=y;lane=i}}card.style.left=(lane*unit)+'px';card.style.top=top+'px';const bottom=top+card.getBoundingClientRect().height+gap;for(let i=lane;i<lane+span;i++)heights[i]=bottom}

}
let packPending=false;function queuePack(){if(packPending)return;packPending=true;requestAnimationFrame(()=>{packPending=false;packCards();drawClock()})}
const cardObserver=new ResizeObserver(queuePack);for(const card of cards.values())cardObserver.observe(card);
const flyOption=document.createElement('label');flyOption.className='fly-setting';flyOption.innerHTML='Color de las luciérnagas <input type="color" id="flyColor" aria-label="Color de las luciérnagas">';$('settings').insertBefore(flyOption,$('settingsList'));

function move(id,delta){const index=layout.order.indexOf(id),next=index+delta;if(next<0||next>=layout.order.length)return;[layout.order[index],layout.order[next]]=[layout.order[next],layout.order[index]];commit()}

$('edit').addEventListener('click',()=>{editing=!editing;document.body.classList.toggle('editing',editing);$('settings').hidden=!editing;$('edit').textContent=editing?'Listo':'Editar';$('edit').setAttribute('aria-expanded',String(editing));if(editing)renderSettings();packCards();drawClock()});$('reset').addEventListener('click',()=>{layout=defaults();commit()});

 for(const [id,key,w,c,low]of [['nvmeTemp','storageTemperature',45,60,'#ffeb91'],['cpuTemp','cpuTemperature',60,85,'#37aaff'],['gpuTemp','gpuTemperature',55,75,'#37aaff'],['coreTemp','coreMaximumTemperature',60,85,'#37aaff']]){text(id,numeric(s[key])?number(s[key],1)+'°C':'N/D');$(id).style.color=color(s[key],w,c,low)}

async function poll(){try{const response=await fetch(location.pathname+'status',{cache:'no-store'});if(!response.ok)throw new Error();render(await response.json())}catch(e){text('status','Sin conexión · comprueba la laptop y tu red');$('status').classList.add('warning')}}
$('full').addEventListener('click',async()=>{try{await document.documentElement.requestFullscreen()}catch(e){text('status','Pantalla completa no disponible en este navegador')}});$('exit').addEventListener('click',async()=>{if(document.fullscreenElement)await document.exitFullscreen()});document.addEventListener('fullscreenchange',()=>{$('full').hidden=!!document.fullscreenElement;$('exit').hidden=!document.fullscreenElement;drawClock()});
// Same 5 x 7 pixel patterns and colors as MatrixClock.lua.
const digits=['11111/10001/10001/10001/10001/10001/11111','00100/01100/00100/00100/00100/00100/01110','11111/00001/00001/11111/10000/10000/11111','11111/00001/00001/11111/00001/00001/11111','10001/10001/10001/11111/00001/00001/00001','11111/10000/10000/11111/00001/00001/11111','11111/10000/10000/11111/10001/10001/11111','11111/00001/00010/00100/01000/01000/01000','11111/10001/10001/11111/10001/10001/11111','11111/10001/10001/11111/00001/00001/11111'].map(s=>s.split('/'));
function drawClock(){const canvas=$('clockCanvas');if(!canvas||cards.get('clock').hidden)return;const r=canvas.getBoundingClientRect();if(!r.width||!r.height)return;const dpr=Math.min(devicePixelRatio||1,2);canvas.width=r.width*dpr;canvas.height=r.height*dpr;const ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);const time=new Date().toLocaleTimeString('en-GB',{hour12:false});canvas.setAttribute('aria-label',time);const unit=Math.min(r.width/42,r.height/7),dot=unit*.68;let x=(r.width-41*unit)/2;const y=(r.height-7*unit)/2;for(const ch of time){if(ch===':'){ctx.fillStyle='#41ffaf';for(const row of[2,4])ctx.fillRect(x+unit*.5,y+row*unit,dot,dot);x+=3*unit;continue}const pattern=digits[Number(ch)];if(!pattern)continue;for(let row=0;row<7;row++)for(let col=0;col<5;col++){ctx.fillStyle=pattern[row][col]==='1'?'#41ffaf':'#142f37';ctx.fillRect(x+col*unit,y+row*unit,dot,dot)}x+=6*unit}}
// Decorative only: independent of sensor data, capped DPR and 20 FPS.
const flyCanvas=$('fireflies'),flyContext=flyCanvas.getContext('2d'),reduceMotion=matchMedia('(prefers-reduced-motion:reduce)');let flyWidth=0,flyHeight=0,previousFrame=0;
const flies=Array.from({length:20},()=>({x:Math.random(),y:Math.random(),phase:Math.random()*Math.PI*2,speed:.4+Math.random()*.7,radius:9+Math.random()*9}));
function resize(){mode=orientation();const dpr=Math.min(devicePixelRatio||1,1.5);flyWidth=innerWidth;flyHeight=innerHeight;flyCanvas.width=flyWidth*dpr;flyCanvas.height=flyHeight*dpr;flyContext.setTransform(dpr,0,0,dpr,0,0);packCards();drawClock()}
function animateFlies(now){requestAnimationFrame(animateFlies);if(document.hidden||now-previousFrame<50)return;previousFrame=now;const t=reduceMotion.matches?0:now/1000,hex=layout.flyColor,rgb=[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16)),bright=rgb.map(v=>Math.min(255,v+60));flyContext.clearRect(0,0,flyWidth,flyHeight);for(const fly of flies){const x=fly.x*flyWidth+Math.sin(t*.22*fly.speed+fly.phase)*35,y=fly.y*flyHeight+Math.cos(t*.17*fly.speed+fly.phase)*30,alpha=.2+(Math.sin(t*.8+fly.phase)+1)*.15,glow=flyContext.createRadialGradient(x,y,0,x,y,fly.radius);glow.addColorStop(0,`rgba(${bright.join(',')},${alpha+.2})`);glow.addColorStop(.18,`rgba(${rgb.join(',')},${alpha})`);glow.addColorStop(1,`rgba(${rgb.join(',')},0)`);flyContext.fillStyle=glow;flyContext.beginPath();flyContext.arc(x,y,fly.radius,0,Math.PI*2);flyContext.fill()}}
layout=loadLayout();saveLayout();arrange();resize();addEventListener('resize',resize);requestAnimationFrame(animateFlies);poll();setInterval(poll,1000);setInterval(drawClock,1000);
