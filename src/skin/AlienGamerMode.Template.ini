[FRAME_TIME]
Measure=WebParser
URL=[HWiNFO_BRIDGE]
StringIndex=34
DynamicVariables=1
IfCondition=(FRAME_TIME <= 0)
IfTrueAction=[!SetOption FrameTimeValue FontColor "145,160,185,255"][!SetOption FrameTimeStatus Text "N/D"][!SetOption FrameTimeStatus FontColor "145,160,185,255"][!UpdateMeterGroup FrameTime][!Redraw]
IfCondition2=(FRAME_TIME > 0) && (FRAME_TIME < 8.3)
IfTrueAction2=[!SetOption FrameTimeValue FontColor "55,170,255,255"][!SetOption FrameTimeStatus Text "¡EXCELENTE!"][!SetOption FrameTimeStatus FontColor "55,170,255,255"][!UpdateMeterGroup FrameTime][!Redraw]
IfCondition3=(FRAME_TIME >= 8.3) && (FRAME_TIME < 16.7)
IfTrueAction3=[!SetOption FrameTimeValue FontColor "45,255,115,255"][!SetOption FrameTimeStatus Text "FLUIDO"][!SetOption FrameTimeStatus FontColor "45,255,115,255"][!UpdateMeterGroup FrameTime][!Redraw]
IfCondition4=(FRAME_TIME >= 16.7) && (FRAME_TIME <= 33.3)
IfTrueAction4=[!SetOption FrameTimeValue FontColor "255,170,35,255"][!SetOption FrameTimeStatus Text "ATENCIÓN"][!SetOption FrameTimeStatus FontColor "255,170,35,255"][!UpdateMeterGroup FrameTime][!Redraw]
IfCondition5=(FRAME_TIME > 33.3)
IfTrueAction5=[!SetOption FrameTimeValue FontColor "255,35,45,255"][!SetOption FrameTimeStatus Text "BAJA FLUIDEZ"][!SetOption FrameTimeStatus FontColor "255,35,45,255"][!UpdateMeterGroup FrameTime][!Redraw]

