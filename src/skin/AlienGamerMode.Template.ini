MinValue=0
MaxValue=16384

[VRAM_FREE_MB]
Measure=WebParser
URL=[HWiNFO_BRIDGE]
StringIndex=32
DynamicVariables=1

[VRAM_TOTAL_MB]
Measure=Calc
Formula=VRAM_USED_MB + VRAM_FREE_MB
DynamicVariables=1

[VRAM_USED_GB]
Measure=Calc
Formula=VRAM_USED_MB / 1024
DynamicVariables=1

[VRAM_TOTAL_GB]
Measure=Calc
Formula=VRAM_TOTAL_MB / 1024
DynamicVariables=1

[VRAM_PERCENT]
Measure=Calc
Formula=(VRAM_TOTAL_MB > 0 ? (VRAM_USED_MB * 100 / VRAM_TOTAL_MB) : 0)
MinValue=0
MaxValue=100
DynamicVariables=1

